<!doctype html>
<html lang="en" data-style="b">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Ask search engines not to list this page -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Lets the page use the dark or light look the phone is set to -->
  <meta name="color-scheme" content="light dark">
  <title>Flat Earth Manual</title>
  <link rel="stylesheet" href="style.css?v=32872b0">
</head>
<body>
  <!-- Password screen: shown only the first time on a phone -->
  <form id="lock" class="lock" hidden>
    <h1 class="brand">Flat Earth Manual</h1>
    <!-- autocomplete lets the iPhone offer to save the password -->
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button id="go" class="btn btn-main" type="submit">Open</button>
    <p class="error" id="err" role="alert"></p>
  </form>

  <!-- Where the screens are drawn (see app.js) -->
  <main id="view"></main>

  <!-- Bottom bar, always visible once unlocked -->
  <nav class="tabbar" hidden>
    <a href="#/" data-tab="home"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 9.5V21h14V9.5"/></svg>Home</a>
    <a href="#/map" data-tab="map"><svg class="icon" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Map</a>
    <a href="#/how" data-tab="how"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>How to</a>
    <a href="#/contacts" data-tab="contacts"><svg class="icon" viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/></svg>Contacts</a>
  </nav>

  <script type="module">
    import { unlock } from './unlock.js?v=32872b0';
    import { start } from './app.js?v=32872b0';

    const form = document.getElementById('lock');
    const pw = document.getElementById('pw');
    const go = document.getElementById('go');
    const err = document.getElementById('err');

    // Shows the form and waits for her to press "Open".
    // Returns { password, showError } as unlock.js expects.
    function showForm(message = '') {
      form.hidden = false;
      err.textContent = message;
      go.disabled = false;
      go.textContent = 'Open';
      pw.focus();
      return new Promise((resolve) => {
        form.onsubmit = (event) => {
          event.preventDefault();           // Stay on this page instead of reloading.
          go.disabled = true;
          go.textContent = 'Opening…';      // Key building takes about a second.
          err.textContent = '';
          resolve({ password: pw.value, showError: (m) => { pw.select(); return showForm(m); } });
        };
      });
    }

    const { content, key } = await unlock(showForm);
    form.hidden = true;
    start(content, key); // Draw the manual.
  </script>
</body>
</html>
